# KloxoNext - build the kloxonext RPM (AlmaLinux 9 and 10).
# Every push / manual run: the RPMs are kept as workflow artifacts.
# A tag 'v*' (git tag v9.0.0 && git push --tags): they are attached to its GitHub release.
name: RPM

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['kloxo/**', 'rpm/**', '.github/workflows/rpm.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rpm:
    strategy:
      matrix:
        el: ['9', '10']
    runs-on: ubuntu-latest
    container: almalinux:${{ matrix.el }}
    steps:
      - name: Build tools
        run: dnf -y -q install git rpm-build tar gzip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash rpm/build-rpm.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kloxonext-el${{ matrix.el }}
          path: rpm/RPMS/*.rpm

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: rpm/RPMS/*.rpm
