; KloxoNext - php-fpm for third-party applications served by the panel
; (phpMyAdmin, ...). Runs the newest PHP installed on the server as 'lxlabs'.
; Binary is selected by 'sh /script/set-kloxo-apps-php'.

[global]
pid = /usr/local/lxlabs/kloxo/init/kloxo-apps.pid
error_log = /usr/local/lxlabs/kloxo/log/apps-fpm-error.log
log_level = error
emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 10s
daemonize = yes

[apps]
listen = /usr/local/lxlabs/kloxo/init/kloxo-apps.sock
listen.owner = lxlabs
listen.group = lxlabs
listen.mode = 0660
user = lxlabs
group = lxlabs
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 3600s
catch_workers_output = yes
security.limit_extensions = .php

env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /usr/local/lxlabs/kloxo/init/tmp/apps
env[TMPDIR] = /usr/local/lxlabs/kloxo/init/tmp/apps

php_admin_value[error_log] = /usr/local/lxlabs/kloxo/log/apps-php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 512M
php_admin_value[post_max_size] = 512M
php_admin_value[max_execution_time] = 3600
php_admin_value[max_input_vars] = 10000
php_admin_value[session.save_path] = /usr/local/lxlabs/kloxo/init/tmp/apps-session
php_admin_value[upload_tmp_dir] = /usr/local/lxlabs/kloxo/init/tmp/apps
php_admin_value[open_basedir] = /usr/local/lxlabs/kloxo/httpdocs/thirdparty:/usr/local/lxlabs/kloxo/init/tmp:/usr/share/php:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
