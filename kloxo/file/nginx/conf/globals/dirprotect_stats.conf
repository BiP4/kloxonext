	#set $var_stats_protectpath 'stats';

	set $var_stats_protectauthname 'AuthStats';
	set $var_stats_protectfile '__stats';

	# $var_domain is 'stats.<domain>' here; the password file lives under <domain>
	set $var_stats_domain $var_domain;

	if ($var_domain ~ ^stats\.(.+)$) {
		set $var_stats_domain $1;
	}

	# KloxoNext - server-wide (the old 'location /(.*)$' was a literal prefix that never matched)
	auth_basic $var_stats_protectauthname;
	auth_basic_user_file /home/httpd/$var_stats_domain/__dirprotect/$var_stats_protectfile;

	# error pages (the 401 page itself) stay reachable without the password
	error_page 401 /error/401.html;

	location ^~ /error/ {
		auth_basic off;
		alias /home/kloxo/httpd/error/;
	}
