    var.stats_protectpath = "stats"

    var.stats_protectauthname = "AuthStats"
    var.stats_protectfile = "__stats"

    # KloxoNext - the whole stats host (the old '^/[/$]' match only covered '//', so
    # awstats.pl was open); var.domain is 'stats.<domain>' here, the password file
    # lives under <domain> (var.stats_domain, set by the vhost)
    auth.backend = "htpasswd"
    auth.backend.htpasswd.userfile = "/home/httpd/" + var.stats_domain + "/__dirprotect/" + var.stats_protectfile

    auth.require = ( "" => (
        "method" => "basic",
        "realm" => var.stats_protectauthname,
        "require" => "valid-user"
    ))
