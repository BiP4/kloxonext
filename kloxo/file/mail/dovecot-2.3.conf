# KloxoNext - virtual mail (Dovecot 2.3). Installed as conf.d/99-kloxonext.conf
# by /script/setup-mail; create conf.d/99-kloxonext-custom.conf for overrides.

protocols = imap pop3 lmtp sieve

auth_mechanisms = plain login
disable_plaintext_auth = yes

passdb {
  driver = passwd-file
  args = scheme=CRYPT username_format=%Lu /etc/dovecot/kloxo/users
}

userdb {
  driver = passwd-file
  args = username_format=%Lu /etc/dovecot/kloxo/users
  default_fields = uid=vmail gid=vmail home=/home/vmail/%Ld/%Ln
}

mail_location = maildir:~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000

ssl = yes
ssl_cert = </usr/local/lxlabs/kloxo/etc/program.pem
ssl_key = </usr/local/lxlabs/kloxo/etc/program.pem
ssl_min_protocol = TLSv1.2

namespace inbox {
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
}

mail_plugins = $mail_plugins quota

plugin {
  quota = maildir:User quota
  quota_grace = 10%%
  sieve = file:~/sieve;active=~/.dovecot.sieve
}

protocol lmtp {
  auth_username_format = %Lu
  postmaster_address = postmaster@__HOSTNAME__
  mail_plugins = $mail_plugins sieve
}

protocol imap {
  mail_plugins = $mail_plugins imap_quota
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

!include_try conf.d/99-kloxonext-custom.conf.ext
