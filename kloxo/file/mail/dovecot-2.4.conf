# KloxoNext - virtual mail (Dovecot 2.4). Installed as conf.d/99-kloxonext.conf
# by /script/setup-mail; create conf.d/99-kloxonext-custom.conf.ext for overrides.

protocols = imap pop3 lmtp sieve

auth_mechanisms = plain login
auth_allow_cleartext = no

passdb passwd-file {
  passwd_file_path = /etc/dovecot/kloxo/users
  default_password_scheme = CRYPT
}

userdb passwd-file {
  passwd_file_path = /etc/dovecot/kloxo/users
  fields {
    uid = vmail
    gid = vmail
    home = /home/vmail/%{user | domain | lower}/%{user | username | lower}
  }
}

mail_driver = maildir
mail_home = /home/vmail/%{user | domain | lower}/%{user | username | lower}
mail_path = ~/Maildir
mail_inbox_path =
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000

ssl = yes
ssl_server_cert_file = /usr/local/lxlabs/kloxo/etc/program.pem
ssl_server_key_file = /usr/local/lxlabs/kloxo/etc/program.pem
ssl_min_protocol = TLSv1.2

namespace inbox {
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
}

mail_plugins {
  quota = yes
}

quota "User quota" {
  # per-user size comes from the passwd-file (userdb_quota_storage_size)
}

sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}

protocol lmtp {
  # virtual users are full addresses (Debian/Ubuntu default strips the domain)
  auth_username_format = %{user | lower}
  postmaster_address = postmaster@__HOSTNAME__
  mail_plugins {
    sieve = yes
  }
}

protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

!include_try conf.d/99-kloxonext-custom.conf.ext
