# KloxoNext - SonarCloud automatic analysis
#
# Third-party code shipped unchanged with the panel: analysed (and fixed) upstream,
# not here. Everything else is analysed.
#   PHPMailer, parseMail, hn_urlrewrite (site preview), YUI drag & drop, Ext JS styles,
#   pure-config.py (Pure-FTPd)
sonar.exclusions=kloxo/httpdocs/lib/extra/class.phpmailer.php,\
  kloxo/httpdocs/lib/extra/class.smtp.php,\
  kloxo/httpdocs/lib/parsemail/**,\
  kloxo/httpdocs/lib/urlrewrite/**,\
  kloxo/httpdocs/theme/js/dragdrop.js,\
  kloxo/httpdocs/theme/css/ext-all.css,\
  kloxo/file/pure-ftpd/usr/sbin/pure-config.py
